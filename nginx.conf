worker_processes auto; 
events {
    worker_connections 1024;
}
 
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    # Ліміт Nginx навмисно більший за 5 МБ: файли до 50 МБ доходять до бекенду,
    # app.py сам відхиляє все, що більше 5 МБ, і записує помилку в app.log.
    # Запити більші за 50 МБ Nginx відсікає одразу (захист сервера).
    client_max_body_size 50m;
 
    server {
        listen 80;
        location = /images/ {
            proxy_pass http://app:8000;
        }
        location /images/ {
            alias /usr/share/nginx/images/;
            autoindex off;
        } 
        location / {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}