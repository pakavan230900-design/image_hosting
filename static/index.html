<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Сервер зображень</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <h1>Сервер зображень</h1>
    <p>Завантаж зображення (.jpg, .png, .gif, до 5 МБ) і отримай пряме посилання на нього.</p>

    <form id="upload-form">
      <input type="file" id="file-input" name="file" accept=".jpg,.jpeg,.png,.gif" required>
      <button type="submit">Завантажити</button>
    </form>

    <div id="result"></div>

    <p><a href="/images-list"><button type="button">Переглянути каталог зображень</button></a></p>
  </div>

  <script>
    document.getElementById('upload-form').addEventListener('submit', async function (e) {
      e.preventDefault();

      const fileInput = document.getElementById('file-input');
      const resultDiv = document.getElementById('result');
      resultDiv.textContent = '';
      resultDiv.className = '';

      if (!fileInput.files.length) {
        return;
      }

      const file = fileInput.files[0];

      const formData = new FormData();
      formData.append('file', file);

      try {
        const response = await fetch('/upload', {
          method: 'POST',
          body: formData,
        });
        // Відповідь може бути не JSON (наприклад, HTML-сторінка помилки від Nginx)
        let data = null;
        try {
          data = await response.json();
        } catch (_) {
          data = null;
        }

        if (response.ok && data) {
          resultDiv.className = 'success';
          resultDiv.innerHTML = `Успіх! Файл завантажено: <a href="${data.url}" target="_blank">${data.filename}</a>`;
          fileInput.value = '';
        } else {
          let message;
          if (data && data.error) {
            message = data.error;
          } else if (response.status === 413) {
            message = 'файл перевищує максимальний розмір 5 МБ';
          } else {
            message = 'сервер повернув помилку ' + response.status;
          }
          resultDiv.className = 'error';
          resultDiv.textContent = 'Помилка: ' + message;
        }
      } catch (err) {
        resultDiv.className = 'error';
        resultDiv.textContent = 'Помилка мережі: ' + err.message;
      }
    });
  </script>
</body>
</html>
